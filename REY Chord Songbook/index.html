<style>
:root{
  --bg:#0b0b0b; --panel:#151515; --panel-2:#1b160d;
  --gold:#c8a451; --gold-hi:#e2c77d; --gold-lo:#7d6428;
  --text:#f5f5f5; --muted:#b8b8b8; --line:#2b2417;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.4}
button,input{font:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}

/* HEADER */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,#191309,#0e0e0e);border-bottom:1px solid var(--gold-lo)}
.rey-home{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1b160d;border:1.5px solid #8a6a1e;color:#f4d67e;text-decoration:none}
.rey-home[hidden]{display:none}
.rey-home svg{width:18px;height:18px;display:block}
.rey-home:hover{border-color:#f4d67e}
.rey-home:focus-visible{outline:3px solid #f4d67e;outline-offset:2px}
.logo{flex:none;width:42px;height:42px;display:block}
.ttl{min-width:0;flex:1}
h1{margin:0;font-size:17px;line-height:1.15;color:var(--gold-hi);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{margin:2px 0 0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{flex:none;margin-left:auto;min-height:36px;padding:6px 12px;border:1px solid var(--gold-lo);border-radius:999px;background:var(--panel-2);color:var(--gold-hi);font-size:13px;font-weight:bold;cursor:pointer}
.back:hover{border-color:var(--gold-hi)}

main{max-width:920px;margin:0 auto;
  padding:14px max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px))}

/* PASANG APLIKASI */
.install{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--gold-lo);border-radius:10px;background:linear-gradient(145deg,#1d1608,#0f0c06);font-size:13px}
.install span{flex:1;min-width:0}
.install .x{flex:none;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}

/* TAB */
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tab{flex:1;min-height:42px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:#121212;color:var(--muted);font-size:14px;font-weight:bold;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--panel-2);border-color:var(--gold);color:var(--gold-hi)}
.tab small{font-weight:normal;opacity:.85}

/* DAFTAR LAGU */
.search input{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--gold-lo);border-radius:10px;background:#101010;color:var(--text);font-size:16px}
.search input::placeholder{color:#7d7d7d}
.search input:focus{border-color:var(--gold-hi)}
.letters{display:flex;gap:6px;margin:10px 0 6px;padding-bottom:4px;overflow-x:auto;scrollbar-width:thin}
.chip{flex:none;min-width:34px;min-height:34px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:#121212;color:var(--muted);font-size:13px;font-weight:bold;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#111}
.count{margin:6px 2px 10px;font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;margin:0 0 10px}
ul.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.rw{display:flex;gap:6px;align-items:stretch}
.item{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;text-align:left;
  border:1px solid var(--line);border-radius:10px;background:linear-gradient(145deg,#151515,#0d0d0d);color:var(--text);cursor:pointer}
.item:hover{border-color:var(--gold)}
.item .no{flex:none;width:26px;color:var(--gold);font-weight:bold;font-size:14px;text-align:center}
.item .tx{min-width:0;flex:1}
.item .t,.item .a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t{font-size:16px;font-weight:bold;color:var(--text)}
.item .a{font-size:13px;color:var(--muted)}
.key{flex:none;padding:3px 9px;border:1px solid var(--gold-lo);border-radius:999px;background:#120f08;color:var(--gold-hi);font-size:12px;font-weight:bold}
.mini{flex:none;width:46px;min-height:58px;border:1px solid var(--line);border-radius:10px;background:#121212;color:var(--muted);font-size:20px;cursor:pointer}
.mini:hover{border-color:var(--gold)}
.mini[aria-pressed="true"]{color:var(--gold-hi);border-color:var(--gold-lo);background:var(--panel-2)}
.mini.sm{width:40px;font-size:16px}
.mini:disabled{opacity:.3;cursor:default}
.more,.wide{display:block;margin:14px auto 0;min-height:44px;padding:10px 22px;border:1px solid var(--gold);border-radius:8px;background:linear-gradient(180deg,#302719,#17120a);color:var(--gold-hi);font-weight:bold;cursor:pointer}
.msg{margin:24px 0;padding:16px;border:1px dashed var(--gold-lo);border-radius:10px;color:var(--muted);text-align:center}
.offline{margin:26px 0 0;padding:14px;border:1px solid var(--line);border-radius:10px;background:#0f0f0f;font-size:13px;color:var(--muted)}
.offline p{margin:0 0 10px}
.offline .wide{margin:0;width:100%}

/* LEMBAR LAGU */
.meta h2{margin:6px 0 2px;font-size:22px;color:var(--gold-hi);line-height:1.2}
.meta p{margin:0;color:var(--muted);font-size:14px}
.meta .k{margin-top:6px;color:var(--text);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{min-height:38px;padding:6px 14px;border:1px solid var(--gold-lo);border-radius:999px;background:var(--panel-2);color:var(--gold-hi);font-size:14px;font-weight:bold;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#111}
.sheet{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#0f0f0f;overflow-x:auto;
  font-family:"DejaVu Sans Mono",Consolas,"Roboto Mono",Menlo,"Courier New",monospace;font-size:15px;line-height:1.35}
.ln{white-space:pre;min-height:1.35em}
.ln.c{color:var(--gold-hi);font-weight:bold}
.ln.sec{margin-top:1.1em;color:var(--gold);font-family:Arial,Helvetica,sans-serif;font-size:.8em;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase}
.ln.sec:first-child{margin-top:0}
.ln.blank{min-height:.7em}
.pad{height:55vh}

/* BAR KONTROL */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 14px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:rgba(14,12,8,.97);border-top:1px solid var(--gold-lo);transition:transform .2s}
.grp{display:flex;align-items:center;gap:6px}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.btn{min-width:40px;min-height:40px;padding:4px 10px;border:1px solid var(--gold-lo);border-radius:8px;background:var(--panel-2);color:var(--gold-hi);font-size:16px;font-weight:bold;cursor:pointer}
.btn:hover{border-color:var(--gold-hi)}
.btn:disabled{opacity:.3;cursor:default}
.btn.val{min-width:58px;font-size:14px}
.btn.wide{padding:4px 14px;font-size:14px}
.btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#111}
.pos{min-width:46px;text-align:center;font-size:14px;font-weight:bold;color:var(--text)}
input[type=range]{width:96px;accent-color:var(--gold)}

/* MODE PANGGUNG */
body.stage .top,body.stage .meta .acts,body.stage .meta .k,body.stage .meta p{display:none}
body.stage main{padding-top:max(10px,env(safe-area-inset-top,0px))}
body.stage .meta h2{margin:0;font-size:16px}
body.stage .sheet{margin-top:8px}
body.stage .bar.hide{transform:translateY(105%)}

@media (max-width:480px){
  .setl .key{display:none}
  .rw .mini.sm{width:38px}
  .item .no{width:20px}
  .lbl{display:none}
  .bar{gap:6px 12px;padding-top:6px}
  .btn{min-height:38px}
  .top.song .ttl{display:none}
  .tab{font-size:13px;padding:6px 4px}
}
@media (max-width:380px){
  h1{font-size:15px}
  .logo{width:36px;height:36px}
  .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

    <button class="btn" id="tFlat" type="button" title="Ganti tampilan ♯ / ♭">♯</button>
  </div>
  <div class="grp" role="group" aria-label="Ukuran huruf">
    <button class="btn" id="fDn" type="button" aria-label="Perkecil huruf">A&minus;</button>
    <button class="btn" id="fUp" type="button" aria-label="Perbesar huruf">A+</button>
  </div>
  <div class="grp" role="group" aria-label="Gulir otomatis">
    <button class="btn wide" id="scr" type="button" aria-pressed="false">&#9654; Gulir</button>
    <input id="spd" type="range" min="1" max="10" value="3" aria-label="Kecepatan gulir">
  </div>
  <div class="grp" id="nav" role="group" aria-label="Daftar manggung" hidden>
    <button class="btn" id="prev" type="button" aria-label="Lagu sebelumnya">&#9664;</button>
    <span class="pos" id="pos">1/1</span>
    <button class="btn" id="next" type="button" aria-label="Lagu berikutnya">&#9654;</button>
  </div>
  <button class="btn" id="stageBtn" type="button" aria-pressed="false" title="Mode panggung (layar penuh)">&#9974; Panggung</button>
</div>

<noscript><p class="msg">Aplikasi ini membutuhkan JavaScript.</p></noscript>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var PAGE = 60;
  var TITLE = 'REY Chord Songbook';
  var SONGS_CACHE = 'rey-songbook-songs-v1';
  var IS_WEB = /^https?:$/.test(location.protocol);

  /* ---------- penyimpanan kecil ---------- */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var DB = { fav: [], set: [], tr: {} };
  (function () {
    try {
      var j = JSON.parse(lsGet('rey-sb-v1') || '{}');
      if (Array.isArray(j.fav)) DB.fav = j.fav.filter(function (x) { return typeof x === 'string'; });
      if (Array.isArray(j.set)) DB.set = j.set.filter(function (x) { return typeof x === 'string'; });
      if (j.tr && typeof j.tr === 'object') DB.tr = j.tr;
    } catch (e) {}
  })();
  function saveDB() { lsSet('rey-sb-v1', JSON.stringify(DB)); }
  function isFav(id) { return DB.fav.indexOf(id) > -1; }
  function inSet(id) { return DB.set.indexOf(id) > -1; }
  function toggle(arr, id) { var i = arr.indexOf(id); if (i > -1) arr.splice(i, 1); else arr.push(id); saveDB(); }

  /* ---------- parser chord ---------- */
  var CH = /^\(?[A-G][#b]?(?:maj|min|dim|aug|sus|add|alt|m|M|[0-9]|[#b+\-°ø])*(?:\/[A-G][#b]?)?\)?$/;
  var EXTRA = /^(?:\(?x\d+\)?|\d+x|\|+|-+|\/|N\.?C\.?|%|\.+|~+)$/i;
  function isChordLine(l) {
    var t = l.trim().split(/\s+/);
    if (!t[0]) return false;
    var any = false;
    for (var i = 0; i < t.length; i++) {
      if (CH.test(t[i])) any = true;
      else if (!EXTRA.test(t[i])) return false;
    }
    return any;
  }
  function parse(text) {
    var raw = text.replace(/\r\n?/g, '\n').replace(/ /g, ' ').replace(/\t/g, '    ').split('\n');
    var out = [], blank = false;
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i].replace(/\s+$/, '');
      var sec = /^\s*\[([^\]]+)\]\s*$/.exec(l);
      if (sec && !CH.test(sec[1].trim())) { out.push({ k: 'sec', t: sec[1].trim() }); blank = false; continue; }
      if (l.trim() === '') { if (!blank && out.length) out.push({ k: 'blank', t: '' }); blank = true; continue; }
      blank = false;
      out.push({ k: isChordLine(l) ? 'chord' : 'lyric', t: l });
    }
    while (out.length && out[out.length - 1].k === 'blank') out.pop();
    return out;
  }

  /* ---------- transpose ---------- */
  var SH = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var FL = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  var BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function idx(n) { var i = BASE[n[0]]; if (n[1] === '#') i++; else if (n[1] === 'b') i--; return (i + 12) % 12; }
  function shiftTok(t, n, flat) {
    return t.replace(/(^|[\/(])([A-G][#b]?)/g, function (m, p, r) {
      return p + (flat ? FL : SH)[(idx(r) + n + 1200) % 12];
    });
  }
  function shiftLine(line, n, flat) {
    var out = '', re = /\S+/g, m;
    while ((m = re.exec(line))) {
      var t = m[0], nt = CH.test(t) ? shiftTok(t, n, flat) : t;
      var pad = Math.max(m.index - out.length, out ? 1 : 0);
      out += new Array(pad + 1).join(' ') + nt;
    }
    return out;
  }
  function usesFlats(lines) {
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].k !== 'chord') continue;
      if (/(^|[\s\/(])[A-G]b/.test(lines[i].t)) return true;
    }
    return false;
  }

  /* ---------- state ---------- */
  var songs = [], byId = {}, view = [], shown = 0, letter = '', tab = 'all';
  var cache = {};
  var cur = null;          // {entry, lines, n, flatPref, flatAuto, fromSet}
  var fromList = false, listScroll = 0, token = 0;
  var fs = parseInt(lsGet('rey-sb-fs'), 10); if (!(fs >= 11 && fs <= 30)) fs = 15;

  var elList = $('#list'), elMore = $('#more'), elCount = $('#count'), elEmpty = $('#empty'), elErr = $('#err');
  var elQ = $('#q'), elLetters = $('#letters'), elSheet = $('#sheet');

  /* ---------- daftar ---------- */
  function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function buildIndex(arr) {
    songs = arr.filter(function (s) { return s && s.id && s.t; }).map(function (s) {
      var title = String(s.t), artist = String(s.a || '');
      var first = norm(title).replace(/[^a-z0-9]/g, '').charAt(0).toUpperCase();
      return { id: String(s.id), t: title, a: artist, k: s.k ? String(s.k) : '',
               s: norm(title + ' ' + artist), L: /[A-Z]/.test(first) ? first : '#' };
    });
    songs.sort(function (a, b) { return a.t.localeCompare(b.t, 'id'); });
    byId = {}; songs.forEach(function (s) { byId[s.id] = s; });
    var f = DB.fav.length + DB.set.length;
    DB.fav = DB.fav.filter(function (id) { return byId[id]; });
    DB.set = DB.set.filter(function (id) { return byId[id]; });
    if (f !== DB.fav.length + DB.set.length) saveDB();
  }
  function buildLetters() {
    var set = {}; songs.forEach(function (s) { set[s.L] = 1; });
    var ls = Object.keys(set).sort(function (a, b) { return a === '#' ? 1 : b === '#' ? -1 : a < b ? -1 : 1; });
    elLetters.innerHTML = '';
    [''].concat(ls).forEach(function (L) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = L || 'Semua';
      b.setAttribute('aria-pressed', L === letter ? 'true' : 'false');
      b.addEventListener('click', function () {
        letter = L;
        Array.prototype.forEach.call(elLetters.children, function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); });
        apply();
      });
      elLetters.appendChild(b);
    });
  }
  function counts() {
    $('#nFav').textContent = DB.fav.length ? '(' + DB.fav.length + ')' : '';
    $('#nSet').textContent = DB.set.length ? '(' + DB.set.length + ')' : '';
  }
  function setTab(t) {
    tab = t;
    Array.prototype.forEach.call($('#tabs').children, function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-tab') === t ? 'true' : 'false'); });
    apply();
  }
  function emptyText() {
    if (tab === 'fav') return 'Belum ada favorit. Buka lagu lalu ketuk ☆ Favorit, atau ketuk bintang di daftar.';
    if (tab === 'set') return 'Daftar manggung masih kosong. Buka lagu lalu ketuk "+ Daftar manggung".';
    return 'Tidak ada lagu yang cocok.';
  }
  function apply() {
    counts();
    var isSet = tab === 'set';
    $('#searchBox').hidden = isSet; elLetters.hidden = tab !== 'all'; $('#setTools').hidden = !(isSet && DB.set.length);
    elList.innerHTML = ''; shown = 0; elList.classList.toggle('setl', isSet);
    if (isSet) {
      view = DB.set.map(function (id) { return byId[id]; }).filter(Boolean);
      elCount.textContent = view.length ? view.length + ' lagu, urutan main dari atas ke bawah' : '';
    } else {
      var words = norm(elQ.value).trim().split(/\s+/).filter(Boolean);
      var base = tab === 'fav' ? songs.filter(function (s) { return isFav(s.id); }) : songs;
      view = base.filter(function (s) {
        if (tab === 'all' && letter && s.L !== letter) return false;
        for (var i = 0; i < words.length; i++) if (s.s.indexOf(words[i]) < 0) return false;
        return true;
      });
      elCount.textContent = !songs.length ? '' : (view.length === base.length ? base.length + ' lagu' : view.length + ' dari ' + base.length + ' lagu');
    }
    elEmpty.textContent = emptyText();
    elEmpty.hidden = view.length > 0 || !songs.length;
    more();
  }
  function mk(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function mini(txt, label, fn, cls) {
    var b = mk('button', 'mini' + (cls ? ' ' + cls : ''), txt); b.type = 'button'; b.setAttribute('aria-label', label); b.addEventListener('click', fn); return b;
  }
  function more() {
    var frag = document.createDocumentFragment();
    var from = shown, isSet = tab === 'set';
    view.slice(from, from + PAGE).forEach(function (s, k) {
      var pos = from + k;
      var li = mk('li'), row = mk('div', 'rw');
      var b = mk('button', 'item'); b.type = 'button';
      if (isSet) b.appendChild(mk('span', 'no', String(pos + 1)));
      var tx = mk('span', 'tx'); tx.appendChild(mk('span', 't', s.t)); if (s.a) tx.appendChild(mk('span', 'a', s.a)); b.appendChild(tx);
      if (s.k) b.appendChild(mk('span', 'key', s.k));
      b.addEventListener('click', function () {
        listScroll = window.scrollY; fromList = true;
        location.hash = (isSet ? '#manggung/' : '#lagu/') + encodeURIComponent(s.id);
      });
      row.appendChild(b);
      if (isSet) {
        row.appendChild(mini('↑', 'Naikkan urutan', function () { moveSet(pos, -1); }, 'sm')).disabled = pos === 0;
        row.appendChild(mini('↓', 'Turunkan urutan', function () { moveSet(pos, 1); }, 'sm')).disabled = pos === view.length - 1;
        row.appendChild(mini('✕', 'Hapus dari daftar manggung', function () { toggle(DB.set, s.id); apply(); }, 'sm'));
      } else {
        var st = mini(isFav(s.id) ? '★' : '☆', 'Favorit', function () {
          toggle(DB.fav, s.id); st.textContent = isFav(s.id) ? '★' : '☆'; st.setAttribute('aria-pressed', isFav(s.id) ? 'true' : 'false'); counts();
          if (tab === 'fav' && !isFav(s.id)) apply();
        });
        st.setAttribute('aria-pressed', isFav(s.id) ? 'true' : 'false'); row.appendChild(st);
      }
      li.appendChild(row); frag.appendChild(li);
    });
    elList.appendChild(frag);
    shown = Math.min(from + PAGE, view.length);
    elMore.hidden = shown >= view.length;
  }
  function moveSet(i, d) {
    var j = i + d; if (j < 0 || j >= DB.set.length) return;
    var t = DB.set[i]; DB.set[i] = DB.set[j]; DB.set[j] = t; saveDB();
    var y = window.scrollY; apply(); window.scrollTo(0, y);
  }
  var timer; elQ.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(apply, 120); });
  elMore.addEventListener('click', more);
  $('#tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) setTab(b.getAttribute('data-tab')); });
  $('#setPlay').addEventListener('click', function () { if (DB.set.length) { listScroll = window.scrollY; fromList = true; location.hash = '#manggung/' + encodeURIComponent(DB.set[0]); } });
  var clearT;
  $('#setClear').addEventListener('click', function () {
    var b = $('#setClear');
    if (b.getAttribute('data-sure') === '1') { clearTimeout(clearT); b.removeAttribute('data-sure'); b.textContent = 'Kosongkan'; DB.set = []; saveDB(); apply(); return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'Yakin? Ketuk lagi';
    clearT = setTimeout(function () { b.removeAttribute('data-sure'); b.textContent = 'Kosongkan'; }, 3000);
  });

  /* ---------- tampilan lagu ---------- */
  function flatNow() { return cur.flatPref !== null ? cur.flatPref : cur.flatAuto; }
  function render() {
    var flat = flatNow(), n = cur.n;
    elSheet.style.fontSize = fs + 'px';
    var frag = document.createDocumentFragment();
    cur.lines.forEach(function (L) {
      var d = document.createElement('div');
      if (L.k === 'sec') { d.className = 'ln sec'; d.textContent = L.t; }
      else if (L.k === 'blank') { d.className = 'ln blank'; }
      else if (L.k === 'chord') { d.className = 'ln c'; d.textContent = (n === 0 && cur.flatPref === null) ? L.t : shiftLine(L.t, n, flat); }
      else { d.className = 'ln'; d.textContent = L.t; }
      frag.appendChild(d);
    });
    elSheet.innerHTML = ''; elSheet.appendChild(frag);
    $('#tVal').textContent = n === 0 ? 'Asli' : (n > 0 ? '+' + n : '−' + Math.abs(n));
    $('#tFlat').textContent = flat ? '♭' : '♯';
    var k = cur.entry.k;
    $('#sKey').textContent = k ? 'Nada dasar: ' + k + (n ? '  →  ' + shiftTok(k, n, flat) : '') : '';
  }
  function updateActs() {
    if (!cur) return; var id = cur.entry.id;
    var f = $('#bFav'), s = $('#bSet');
    f.setAttribute('aria-pressed', isFav(id) ? 'true' : 'false'); f.textContent = (isFav(id) ? '★' : '☆') + ' Favorit';
    s.setAttribute('aria-pressed', inSet(id) ? 'true' : 'false'); s.textContent = inSet(id) ? '✓ Di daftar manggung' : '+ Daftar manggung';
    updateNav();
  }
  function updateNav() {
    var nav = $('#nav'), i = cur && cur.fromSet ? DB.set.indexOf(cur.entry.id) : -1;
    if (i < 0) { nav.hidden = true; return; }
    nav.hidden = false; $('#pos').textContent = (i + 1) + '/' + DB.set.length;
    $('#prev').disabled = i === 0; $('#next').disabled = i === DB.set.length - 1;
  }
  function showList() {
    stopScroll(); setStage(false); token++;
    $('#songView').hidden = true; $('#bar').hidden = true; $('#back').hidden = true;
    $('#listView').hidden = false; cur = null;
    $('#top').classList.remove('song');
    document.title = TITLE;
    apply();
    var y = listScroll; requestAnimationFrame(function () { window.scrollTo(0, y); });
  }
  function openSong(id, fromSet) {
    var entry = byId[id];
    if (!entry) { showList(); return; }
    stopScroll();
    var my = ++token;
    $('#listView').hidden = true; $('#songView').hidden = false; $('#back').hidden = false; $('#bar').hidden = false;
    $('#top').classList.add('song');
    $('#sTitle').textContent = entry.t; $('#sArtist').textContent = entry.a; $('#sKey').textContent = '';
    elSheet.textContent = 'Memuat…';
    document.title = entry.t + ' · ' + TITLE;
    window.scrollTo(0, 0);
    cur = null; $('#nav').hidden = true;
    var p = cache[id] ? Promise.resolve(cache[id]) :
      fetch('songs/' + encodeURIComponent(id) + '.txt').then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (t) { cache[id] = t; return t; });
    p.then(function (text) {
      if (my !== token) return;
      var lines = parse(text);
      cur = { entry: entry, lines: lines, n: DB.tr[id] || 0, flatPref: null, flatAuto: usesFlats(lines), fromSet: !!fromSet };
      render(); updateActs(); showBar();
    }).catch(function () { if (my === token) elSheet.textContent = 'Lagu ini belum bisa dimuat. Kalau sedang offline, lagu ini belum pernah dibuka atau disimpan.'; });
  }
  function route() {
    var m = /^#(lagu|manggung)\/(.+)$/.exec(location.hash);
    if (m) { try { openSong(decodeURIComponent(m[2]), m[1] === 'manggung'); } catch (e) { showList(); } }
    else showList();
  }

  /* ---------- kontrol ---------- */
  function setN(n) {
    if (!cur) return; cur.n = Math.max(-11, Math.min(11, n)); render();
    if (cur.n) DB.tr[cur.entry.id] = cur.n; else delete DB.tr[cur.entry.id]; saveDB();
  }
  $('#tUp').addEventListener('click', function () { if (cur) setN(cur.n + 1); kick(); });
  $('#tDn').addEventListener('click', function () { if (cur) setN(cur.n - 1); kick(); });
  $('#tVal').addEventListener('click', function () { if (cur) { cur.flatPref = null; setN(0); } kick(); });
  $('#tFlat').addEventListener('click', function () { if (cur) { cur.flatPref = !flatNow(); render(); } kick(); });
  function setFs(v) { fs = Math.max(11, Math.min(30, v)); lsSet('rey-sb-fs', String(fs)); elSheet.style.fontSize = fs + 'px'; kick(); }
  $('#fUp').addEventListener('click', function () { setFs(fs + 1); });
  $('#fDn').addEventListener('click', function () { setFs(fs - 1); });
  $('#back').addEventListener('click', function () { if (fromList) { fromList = false; history.back(); } else location.hash = ''; });
  $('#bFav').addEventListener('click', function () { if (cur) { toggle(DB.fav, cur.entry.id); updateActs(); } });
  $('#bSet').addEventListener('click', function () { if (cur) { toggle(DB.set, cur.entry.id); updateActs(); } });
  function go(d) {
    if (!cur) return; var i = DB.set.indexOf(cur.entry.id), j = i + d;
    if (i < 0 || j < 0 || j >= DB.set.length) return;
    location.replace('#manggung/' + encodeURIComponent(DB.set[j]));
  }
  $('#prev').addEventListener('click', function () { go(-1); });
  $('#next').addEventListener('click', function () { go(1); });
  window.addEventListener('keydown', function (e) {
    if (!cur) return;
    if (e.key === 'Escape') { if (stage) setStage(false); else $('#back').click(); }
    else if (e.key === 'ArrowRight' && cur.fromSet && !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) go(1);
    else if (e.key === 'ArrowLeft' && cur.fromSet && !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) go(-1);
  });

  /* ---------- gulir otomatis + layar tetap menyala ---------- */
  var SPEED = [8, 14, 22, 32, 44, 58, 76, 98, 124, 156];   // piksel per detik
  var scrolling = false, last = 0, acc = 0, lock = null, stage = false, fsOk = false, barT;
  var btnScr = $('#scr'), rng = $('#spd');
  function updateLock() {
    var need = scrolling || stage;
    try {
      if (need && !lock && navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { lock = l; l.addEventListener('release', function () { if (lock === l) lock = null; }); }, function () {});
      else if (!need && lock) { lock.release(); lock = null; }
    } catch (e) {}
  }
  function tick(ts) {
    if (!scrolling) return;
    acc += SPEED[(+rng.value || 3) - 1] * Math.min((ts - last) / 1000, 0.25); last = ts;
    var d = Math.floor(acc);
    if (d > 0) { acc -= d; window.scrollBy(0, d); }
    var atEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
    if (atEnd) stopScroll(); else requestAnimationFrame(tick);
  }
  function startScroll() {
    if (scrolling || !cur) return;
    scrolling = true; acc = 0; last = performance.now();
    btnScr.setAttribute('aria-pressed', 'true'); btnScr.innerHTML = '&#9208; Berhenti';
    updateLock(); requestAnimationFrame(tick);
  }
  function stopScroll() {
    scrolling = false;
    btnScr.setAttribute('aria-pressed', 'false'); btnScr.innerHTML = '&#9654; Gulir';
    updateLock();
  }
  btnScr.addEventListener('click', function () { scrolling ? stopScroll() : startScroll(); kick(); });
  rng.addEventListener('input', kick);
  ['wheel', 'touchstart'].forEach(function (ev) { elSheet.addEventListener(ev, function () { if (scrolling) stopScroll(); }, { passive: true }); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) stopScroll(); else updateLock(); });

  /* ---------- mode panggung (layar penuh) ---------- */
  function showBar() { var b = $('#bar'); b.classList.remove('hide'); clearTimeout(barT); }
  function kick() {            // tampilkan bar, lalu sembunyikan lagi setelah beberapa detik (mode panggung)
    if (!stage) return; showBar();
    barT = setTimeout(function () { $('#bar').classList.add('hide'); }, 4500);
  }
  function setStage(on) {
    if (on === stage) return;
    stage = on; document.body.classList.toggle('stage', on);
    var sb = $('#stageBtn'); sb.setAttribute('aria-pressed', on ? 'true' : 'false'); sb.innerHTML = on ? '&#10005; Keluar' : '&#9974; Panggung';
    var de = document.documentElement;
    if (on) {
      try {
        if (de.requestFullscreen) de.requestFullscreen({ navigationUI: 'hide' }).then(function () { fsOk = true; }, function () { fsOk = false; });
      } catch (e) {}
      kick(); window.scrollTo(0, 0);
    } else {
      showBar(); clearTimeout(barT);
      try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
      fsOk = false;
    }
    updateLock();
  }
  $('#stageBtn').addEventListener('click', function () { setStage(!stage); });
  document.addEventListener('fullscreenchange', function () { if (stage && fsOk && !document.fullscreenElement) setStage(false); });
  elSheet.addEventListener('click', function () {
    if (!stage || (window.getSelection && String(window.getSelection()))) return;
    var b = $('#bar'); if (b.classList.contains('hide')) kick(); else { b.classList.add('hide'); clearTimeout(barT); }
  });

  /* ---------- pasang sebagai aplikasi ---------- */
  var dip = null;
  function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function dismissed() { var t = parseInt(lsGet('rey-sb-noinst'), 10); return t && Date.now() - t < 14 * 864e5; }
  function showInstall(txt, withBtn) {
    if (!IS_WEB || standalone() || dismissed()) return;
    $('#installTxt').textContent = txt; $('#installBtn').hidden = !withBtn; $('#install').hidden = false;
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); dip = e;
    showInstall('Pasang sebagai aplikasi di perangkatmu.', true);
  });
  window.addEventListener('appinstalled', function () { dip = null; $('#install').hidden = true; });
  $('#installBtn').addEventListener('click', function () {
    if (!dip) return; dip.prompt();
    dip.userChoice.then(function () { dip = null; $('#install').hidden = true; }, function () {});
  });
  $('#installX').addEventListener('click', function () { $('#install').hidden = true; lsSet('rey-sb-noinst', String(Date.now())); });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) showInstall('Di iPhone/iPad: ketuk tombol Bagikan, lalu "Tambahkan ke Layar Utama".', false);

  /* ---------- simpan offline ---------- */
  var canCache = IS_WEB && 'serviceWorker' in navigator && 'caches' in window;
  var dl = { run: false, stop: false };
  function cachedIds() {
    return caches.open(SONGS_CACHE).then(function (c) { return c.keys(); }).then(function (ks) {
      var o = {}; ks.forEach(function (r) { var m = /\/songs\/([^/]+)\.txt$/.exec(decodeURIComponent(new URL(r.url).pathname)); if (m) o[m[1]] = 1; });
      return o;
    });
  }
  function offStatus() {
    if (!canCache || !songs.length) return;
    cachedIds().then(function (o) {
      var n = songs.filter(function (s) { return o[s.id]; }).length;
      $('#offline').hidden = false;
      $('#offTxt').textContent = 'Tersimpan untuk offline: ' + n + ' dari ' + songs.length + ' lagu. Lagu yang pernah kamu buka otomatis ikut tersimpan.';
      $('#offBtn').textContent = n >= songs.length ? 'Semua lagu sudah tersimpan ✓' : 'Simpan semua lagu untuk offline';
      $('#offBtn').disabled = n >= songs.length;
    }).catch(function () {});
  }
  $('#offBtn').addEventListener('click', function () {
    var btn = $('#offBtn');
    if (dl.run) { dl.stop = true; return; }
    cachedIds().then(function (o) {
      var todo = songs.filter(function (s) { return !o[s.id]; }), done = 0, i = 0, fail = 0;
      if (!todo.length) { offStatus(); return; }
      dl.run = true; dl.stop = false; btn.textContent = 'Menyimpan 0/' + todo.length + ' (ketuk untuk berhenti)';
      function worker() {
        if (dl.stop || i >= todo.length) return Promise.resolve();
        var s = todo[i++];
        return fetch('songs/' + encodeURIComponent(s.id) + '.txt').then(function (r) { if (!r.ok) fail++; }, function () { fail++; })
          .then(function () { done++; btn.textContent = 'Menyimpan ' + done + '/' + todo.length + ' (ketuk untuk berhenti)'; return worker(); });
      }
      Promise.all([worker(), worker(), worker(), worker()]).then(function () {
        dl.run = false; offStatus();
        if (fail) $('#offTxt').textContent += ' ' + fail + ' lagu gagal disimpan, coba lagi nanti.';
      });
    });
  });

  /* ---------- mulai ---------- */
  window.addEventListener('hashchange', route);
  fetch('songs/index.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (arr) { buildIndex(arr); buildLetters(); apply(); route(); offStatus(); })
    .catch(function () { elErr.hidden = false; });

  if (IS_WEB && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { scope: './' }).then(function () { setTimeout(offStatus, 1500); }).catch(function () {}); });
  }
})();
</script>
