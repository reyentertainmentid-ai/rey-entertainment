
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REY Master Suite</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      background: #080808;
      color: #e2c77d;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }

    img {
      display: block;
      width: 100%;
      max-width: 700px;
      max-height: calc(100dvh - 130px);
      height: auto;
      object-fit: contain;
      flex: 0 1 auto;
      min-height: 0;
    }

    h1 {
      flex: 0 0 auto;
      margin: 0;
      font-size: clamp(18px, 4vw, 34px);
      letter-spacing: 2px;
    }

    @media (max-height: 500px) {
      body {
        padding: 8px;
        gap: 8px;
      }

      img {
        max-height: calc(100dvh - 65px);
      }

      h1 {
        font-size: clamp(15px, 3vh, 22px);
      }
    }
  </style>
</head>

<body>
  <img src="arif.png" alt="REY Master Suite">
  <h1>JANGAN LUPA NGOPI BRO ☕</h1>
</body>
</html>
