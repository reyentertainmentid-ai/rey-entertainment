<style>
  /* Layout: satu layar tanpa scroll. Header, pilihan tuning, panel ukur yang menyusut mengikuti tinggi layar, tombol nada, kontrol. Hitam dan gold. */
  :root {
    --bg: #0a0908;
    --panel: #14110c;
    --panel-2: #1b160d;
    --line: #2f2713;
    --gold: #d6ad4a;
    --gold-hi: #f4d67e;
    --gold-lo: #8a6a1e;
    --fg: #f3ecda;
    --muted: #9b8f76;
    --ok: #5fe39a;
    --warn: #ff8a4c;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-disp: "Orbitron", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --font-num: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Roboto Mono", monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(120% 55% at 50% 0%, #1a1408 0%, var(--bg) 60%) no-repeat, var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.3;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    padding-block: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

  /* ---------- Header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .logo { width: 34px; height: 34px; flex: none; border-radius: 50%; display: block; }
  h1 {
    margin: 0; font-family: var(--font-disp); font-weight: 900; font-size: 13px; letter-spacing: 0.03em;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .home {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--panel-2); border: 1.5px solid var(--gold-lo); color: var(--gold-hi); text-decoration: none;
  }
  .home svg { width: 18px; height: 18px; display: block; }
  .home:hover { border-color: var(--gold-hi); }
  .home:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 2px; }
  .a4 { display: flex; align-items: center; gap: 3px; flex: none; }
  .a4 span { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; }
  .a4 b { font-family: var(--font-num); font-variant-numeric: tabular-nums; min-width: 2.4em; text-align: center; font-size: 15px; }
  .a4 button { min-height: 30px; min-width: 30px; padding: 0; font-size: 18px; line-height: 1; border-radius: 9px; }

  select, button { font: inherit; color: inherit; }
  select {
    flex: none; width: 100%; height: 44px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 0 12px; font-size: 15px; text-overflow: ellipsis;
  }

  /* ---------- Panel ukur ---------- */
  .meter {
    flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: 16px; padding: 8px 10px 10px;
  }
  svg.gauge { flex: 1; min-height: 0; width: 100%; display: block; }
  .gauge .tick { stroke: var(--gold-lo); stroke-width: 2; }
  .gauge .tick.major { stroke: var(--gold); stroke-width: 3; }
  .gauge .zone { stroke: var(--gold); stroke-width: 14; fill: none; opacity: 0.3; }
  .gauge .lbl { fill: var(--muted); font-size: 13px; font-family: var(--font-num); text-anchor: middle; }
  .gauge .fl, .gauge .sh { fill: var(--gold); font-size: 24px; font-family: var(--font-ui); font-weight: 700; text-anchor: middle; opacity: 0.7; }
  .gauge .needle { stroke: var(--gold-hi); stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(244,214,126,0.6)); }
  .gauge .note { font-family: var(--font-disp); font-weight: 900; font-size: 56px; fill: var(--gold-hi); }
  .gauge .note .oct { font-size: 24px; font-weight: 700; fill: var(--gold-lo); }
  .gauge .cv { font-family: var(--font-disp); font-weight: 700; font-size: 40px; fill: var(--fg); font-variant-numeric: tabular-nums; }
  .gauge .cv .unit { font-family: var(--font-ui); font-weight: 600; font-size: 14px; fill: var(--muted); letter-spacing: 0.08em; }
  .gauge .st { font-family: var(--font-ui); font-weight: 800; font-size: 14px; letter-spacing: 0.22em; fill: var(--muted); }
  .gauge .hz { font-family: var(--font-num); font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }

  .meter.idle .needle { opacity: 0.3; filter: none; }
  .meter.idle .note { fill: #4a3f22; }
  .meter.idle .note .oct { fill: #4a3f22; }
  .meter.idle .cv { fill: #4a3f22; }
  .meter.ok .needle { stroke: var(--ok); filter: drop-shadow(0 0 6px rgba(95,227,154,0.7)); }
  .meter.ok .zone { stroke: var(--ok); opacity: 0.55; }
  .meter.ok .note, .meter.ok .cv, .meter.ok .st { fill: var(--ok); }
  .meter.warn .cv, .meter.warn .st { fill: var(--warn); }

  .level { flex: none; height: 5px; border-radius: 3px; background: #0d0b07; border: 1px solid var(--line); position: relative; overflow: hidden; margin-inline: 6px; }
  .level .fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); }
  .level .gate { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); opacity: 0.6; }

  /* ---------- Tombol nada ---------- */
  .strings { flex: none; display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; gap: 6px; }
  .string, .chip {
    min-width: 0; height: 48px; padding: 0; border-radius: 12px; cursor: pointer; line-height: 1;
    background: var(--panel-2); border: 1.5px solid var(--gold-lo); color: var(--gold-hi);
    display: flex; align-items: center; justify-content: center;
  }
  .string .n { font-family: var(--font-disp); font-weight: 700; font-size: 16px; white-space: nowrap; }
  .string .n i { font-style: normal; font-size: 10px; color: var(--muted); margin-left: 1px; }
  .chips { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .chip { height: 40px; cursor: default; font-family: var(--font-disp); font-weight: 700; font-size: 14px; color: var(--muted); border-color: var(--line); }
  .string.sel { border-color: var(--gold-hi); box-shadow: 0 0 0 2px rgba(244,214,126,0.25); }
  .string.hit, .chip.hit { border-color: var(--warn); color: var(--warn); }
  .string.hit.ok, .chip.hit.ok { border-color: var(--ok); color: var(--ok); background: rgba(95,227,154,0.1); box-shadow: 0 0 14px rgba(95,227,154,0.3); }

  /* ---------- Kontrol ---------- */
  .controls { flex: none; display: flex; gap: 8px; }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 0 14px; cursor: pointer; min-height: 48px;
  }
  button.primary {
    flex: 1 1 0; min-width: 0;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, var(--gold-lo));
    color: #1a1204; border-color: var(--gold); font-weight: 800; font-size: 16px; letter-spacing: 0.06em;
  }
  .seg { flex: 1.5 1 0; min-width: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; border-radius: 0; background: transparent; padding-inline: 4px; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #1a1204; font-weight: 800; }
  .msg { flex: none; min-height: 0; text-align: center; font-size: 13px; color: var(--muted); }
  .msg:empty { display: none; }
  .msg.err { color: var(--warn); }
  .install { flex: none; }
  .install button { width: 100%; min-height: 40px; font-size: 14px; color: var(--gold-hi); border-color: var(--gold-lo); }

  @media (max-width: 380px) { h1 { font-size: 12px; } .a4 span { display: none; } }
  @media (max-width: 340px) { .logo { display: none; } }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Layar pendek (HP miring): panel ukur di kiri, kontrol di kanan */
  @media (orientation: landscape) and (max-height: 520px) {
    .app { max-width: 920px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto 1fr auto auto auto; column-gap: 12px; row-gap: 8px; }
    .app > header { grid-column: 2; grid-row: 1; }
    .app > .selwrap { grid-column: 2; grid-row: 2; }
    .app > .meter { grid-column: 1; grid-row: 1 / 7; }
    .app > .strings { grid-column: 2; grid-row: 3; justify-content: center; }
    .app > .controls { grid-column: 2; grid-row: 4; }
    .app > .install { grid-column: 2; grid-row: 5; }
    .app > .msg { grid-column: 2; grid-row: 6; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  // ---------- Data tuning ----------
  var SHARP = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var FLAT  = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];

  // Nada dalam MIDI, dari senar paling rendah ke paling tinggi. C4 = 60.
  var LIB = {
    std:    ["Standar",                  [40,45,50,55,59,64]],
    dropd:  ["Drop D",                   [38,45,50,55,59,64]],
    ddropd: ["Double Drop D",            [38,45,50,55,59,62]],
    dmodal: ["D modal",                  [38,45,50,55,57,62]],
    daddy:  ["Double Daddy",             [38,45,50,50,57,62]],
    dropc:  ["Drop C",                   [36,43,48,53,57,62]],
    dropcs: ["Drop C#",                  [37,44,49,54,58,63]],
    dropb:  ["Drop B",                   [35,42,47,52,56,61]],
    dropa:  ["Drop A",                   [33,40,45,50,54,59]],
    opc:    ["Open C",                   [36,43,48,55,60,64]],
    ope:    ["Open E",                   [40,47,52,56,59,64]],
    opf:    ["Open F",                   [41,45,48,53,60,65]],
    opg:    ["Open G",                   [38,43,50,55,59,62]],
    opa:    ["Open A",                   [40,45,52,57,61,64]],
    opa2:   ["Open A2",                  [33,45,52,57,61,64]],
    opam:   ["Open Am",                  [40,45,52,57,60,64]],
    opem:   ["Open Em",                  [40,47,52,55,59,64]],
    opd:    ["Open D",                   [38,45,50,54,57,62]],
    opdm:   ["Open Dm",                  [38,45,50,53,57,62]],
    m1:     ["-1 (Eb) Half step down",   [39,44,49,54,58,63], true],
    m2:     ["-2 (D) Whole step down",   [38,43,48,53,57,62]],
    p1:     ["+1 (F) Half step up",      [41,46,51,56,60,65]],
    p2:     ["+2 (F#) Whole step up",    [42,47,52,57,61,66]],
    gmodal: ["G modal",                  [38,43,50,55,60,62]],
    all4:   ["All 4th",                  [40,45,50,55,60,65]],
    nst:    ["NST",                      [36,43,50,57,64,67]],
    s7std:  ["Standar",                  [35,40,45,50,55,59,64]],
    s7dropa:["Drop A",                   [33,40,45,50,55,59,64]],
    s7rus:  ["Gitar Rusia",              [38,43,47,50,55,59,62]],
    s7bra:  ["Gitar Brasil",             [36,40,45,50,55,59,64]]
  };
  var POWER6  = ["dropd","ddropd","dmodal","daddy","dropc","dropcs","dropb","dropa"];
  var POWER12 = ["dropd","ddropd","dmodal","dropc","dropcs","dropb","dropa"];
  var OPEN    = ["opc","ope","opf","opg","opa","opa2","opam","opem","opd","opdm"];
  var EXTRA6  = ["m1","m2","p1","p2","gmodal","all4","nst"];
  var EXTRA12 = ["m1","m2"];

  // Gitar 12 senar: empat pasang bawah berisi senar oktaf di atasnya, dua pasang atas unison.
  function twelve(m) { return m.map(function (x, i) { return i < 4 ? x + 12 : x; }); }

  var GROUPS = [], TUNINGS = {};
  function addGroup(label, prefix, keys, is12) {
    var items = keys.map(function (k) {
      var d = LIB[k], t = { id: prefix + "-" + k, name: d[0], midi: d[1], flats: !!d[2] };
      if (is12) t.second = twelve(d[1]);
      TUNINGS[t.id] = t;
      return t;
    });
    GROUPS.push({ label: label, items: items });
  }
  (function () {
    var c = { id: "chrom", name: "Kromatik (semua nada)", chrom: true, midi: [] };
    TUNINGS.chrom = c;
    GROUPS.push({ label: "Kromatik", items: [c] });
  })();
  addGroup("Gitar 6 Senar Standar", "g6", ["std"]);
  addGroup("Gitar 6 Senar Power", "g6", POWER6);
  addGroup("Gitar 6 Senar Open", "g6", OPEN);
  addGroup("Gitar 6 Senar Ekstra", "g6", EXTRA6);
  addGroup("Gitar 7 Senar Standar", "g7", ["s7std"]);
  addGroup("Gitar 7 Senar Lainnya", "g7", ["s7dropa","s7rus","s7bra"]);
  addGroup("Gitar 12 Senar Standar", "g12", ["std"], true);
  addGroup("Gitar 12 Senar Power", "g12", POWER12, true);
  addGroup("Gitar 12 Senar Open", "g12", OPEN, true);
  addGroup("Gitar 12 Senar Ekstra", "g12", EXTRA12, true);

  var DEFAULT_TUNING = "g6-std";
  var GATE = 0.006;      // batas volume (RMS) sebelum suara dianggap hening
  var OK_CENTS = 3;      // selisih yang dianggap pas

  var state = { tuning: DEFAULT_TUNING, mode: "auto", sel: 0, a4: 440, running: false };
  try {
    var saved = JSON.parse(localStorage.getItem("reyGuitarTuner2") || "{}");
    if (saved.tuning && TUNINGS[saved.tuning]) state.tuning = saved.tuning;
    if (saved.a4 >= 430 && saved.a4 <= 450) state.a4 = saved.a4;
  } catch (e) {}
  function persist() {
    try { localStorage.setItem("reyGuitarTuner2", JSON.stringify({ tuning: state.tuning, a4: state.a4 })); } catch (e) {}
  }

  // ---------- Helpers ----------
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function cur() { return TUNINGS[state.tuning]; }
  function isChrom() { return !!cur().chrom; }
  function targets() { var t = cur(); return t.second ? t.midi.concat(t.second) : t.midi; }
  function midiFreq(m) { return state.a4 * Math.pow(2, (m - 69) / 12); }
  function nameOf(m, flats) { return (flats ? FLAT : SHARP)[((m % 12) + 12) % 12]; }
  function octOf(m) { return Math.floor(m / 12) - 1; }
  function noteHTML(m, flats) { return nameOf(m, flats) + '<tspan class="oct">' + octOf(m) + "</tspan>"; }
  function centsBetween(f, ref) { return 1200 * Math.log(f / ref) / Math.LN2; }
  function median(a) { var s = a.slice().sort(function (x, y) { return x - y; }); return s[Math.floor(s.length / 2)]; }
  function levelOf(rms) { return clamp((20 * Math.log(rms + 1e-9) / Math.LN10 + 70) / 60, 0, 1); }


  // ---------- Gauge ----------
  var CX = 200, CY = 205, R = 150, SPAN = 62;
  function pt(angleDeg, r) {
    var a = angleDeg * Math.PI / 180;
    return [CX + r * Math.sin(a), CY - r * Math.cos(a)];
  }
  (function buildGauge() {
    var html = "";
    for (var c = -50; c <= 50; c += 5) {
      var ang = c / 50 * SPAN, major = (c % 25 === 0);
      var p1 = pt(ang, R - (major ? 26 : 14)), p2 = pt(ang, R);
      html += '<line class="tick' + (major ? " major" : "") + '" x1="' + p1[0].toFixed(1) + '" y1="' + p1[1].toFixed(1) +
              '" x2="' + p2[0].toFixed(1) + '" y2="' + p2[1].toFixed(1) + '"></line>';
      if (major) {
        var lp = pt(ang, R + 16);
        var t = c === 0 ? "0" : (c > 0 ? "+" + c : "−" + (-c));
        html += '<text class="lbl" x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + 4).toFixed(1) + '">' + t + '</text>';
      }
    }
    $("ticks").innerHTML = html;
    var z1 = pt(-OK_CENTS / 50 * SPAN, R), z2 = pt(OK_CENTS / 50 * SPAN, R);
    $("zone").setAttribute("d", "M" + z1[0].toFixed(1) + " " + z1[1].toFixed(1) +
      " A" + R + " " + R + " 0 0 1 " + z2[0].toFixed(1) + " " + z2[1].toFixed(1));
  })();
  function setNeedle(cents) {
    $("needleG").setAttribute("transform", "rotate(" + (clamp(cents, -50, 50) / 50 * SPAN).toFixed(2) + " " + CX + " " + CY + ")");
  }

  // ---------- Pilihan tuning & tombol nada ----------
  function noteList(t) {
    return t.midi.map(function (m) { return nameOf(m, t.flats) + octOf(m); }).join(" ");
  }
  function buildTuningSelect() {
    var sel = $("tuningSel");
    sel.innerHTML = "";
    GROUPS.forEach(function (g) {
      var og = document.createElement("optgroup");
      og.label = g.label;
      g.items.forEach(function (t) {
        var o = document.createElement("option");
        o.value = t.id;
        o.textContent = t.chrom ? t.name : t.name + "  ·  " + noteList(t);
        if (t.id === state.tuning) o.selected = true;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
  }

  var buttons = [], chips = [];
  function makeBtn(i) {
    var t = cur(), m = targets()[i];
    var b = document.createElement("button");
    b.className = "string"; b.type = "button";
    b.setAttribute("aria-label", "Nada " + nameOf(m, t.flats) + octOf(m));
    b.innerHTML = '<span class="n">' + nameOf(m, t.flats) + '<i>' + octOf(m) + '</i></span>';
    b.addEventListener("click", function () { state.sel = i; setMode("manual"); });
    buttons[i] = b;
    return b;
  }
  function buildStrings() {
    var box = $("strings"), t = cur();
    box.innerHTML = ""; buttons = []; chips = [];
    $("seg").hidden = !!t.chrom;
    if (t.chrom) {
      var grid = document.createElement("div");
      grid.className = "chips";
      SHARP.forEach(function (n, i) {
        var c = document.createElement("div");
        c.className = "chip"; c.textContent = n;
        chips[i] = c; grid.appendChild(c);
      });
      box.appendChild(grid);
      return;
    }
    var n = t.midi.length, rows = t.second ? [[n, 2 * n], [0, n]] : [[0, n]];
    rows.forEach(function (r) {
      var row = document.createElement("div");
      row.className = "row";
      row.style.gridTemplateColumns = "repeat(" + n + ", minmax(0, 1fr))";
      for (var i = r[0]; i < r[1]; i++) row.appendChild(makeBtn(i));
      box.appendChild(row);
    });
  }

  var hitIndex = -1, hitChip = -1, isOk = false;
  function markStrings() {
    buttons.forEach(function (b, i) {
      b.classList.toggle("sel", state.mode === "manual" && i === state.sel);
      b.classList.toggle("hit", i === hitIndex);
      b.classList.toggle("ok", i === hitIndex && isOk);
    });
    chips.forEach(function (c, i) {
      c.classList.toggle("hit", i === hitChip);
      c.classList.toggle("ok", i === hitChip && isOk);
    });
  }
  function setMode(m) {
    state.mode = m;
    $("modeAuto").setAttribute("aria-pressed", String(m === "auto"));
    $("modeManual").setAttribute("aria-pressed", String(m === "manual"));
    resetReading();
  }
  function updateA4() { $("a4Val").textContent = String(state.a4); }
  $("gateMark").style.left = (levelOf(GATE) * 100).toFixed(1) + "%";

  // ---------- Audio ----------
  var ctx = null, analyser = null, stream = null, source = null, buf = null, wakeLock = null;

  function getCtx() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function setMsg(text, err) {
    var m = $("msg"); m.textContent = text || ""; m.classList.toggle("err", !!err);
  }

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMsg("Mikrofon tidak tersedia. Buka halaman ini lewat HTTPS di browser terbaru.", true);
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
      });
    } catch (e) {
      var denied = e && (e.name === "NotAllowedError" || e.name === "SecurityError");
      setMsg(denied ? "Izin mikrofon ditolak. Izinkan mikrofon di pengaturan situs, lalu tekan Mulai lagi."
                    : "Mikrofon tidak bisa dibuka. Pastikan tidak dipakai aplikasi lain.", true);
      return;
    }
    var c = getCtx();
    source = c.createMediaStreamSource(stream);
    analyser = c.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0;
    source.connect(analyser);
    buf = new Float32Array(analyser.fftSize);
    state.running = true;
    $("startBtn").textContent = "BERHENTI";
    setMsg("");
    resetReading();
    try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { wakeLock = null; }
  }

  function stop() {
    state.running = false;
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    if (source) { try { source.disconnect(); } catch (e) {} }
    stream = null; source = null; analyser = null; levelTarget = 0;
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
    $("startBtn").textContent = "MULAI";
    setMsg("");
    resetReading();
  }

  document.addEventListener("visibilitychange", function () {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend(); }
    else {
      ctx.resume();
      if (state.running && navigator.wakeLock) {
        navigator.wakeLock.request("screen").then(function (w) { wakeLock = w; }).catch(function () {});
      }
    }
  });

  // ---------- Deteksi pitch (YIN) ----------
  function yin(data, sr) {
    var W = 2048;
    var maxTau = Math.min(Math.floor(sr / 45), data.length - W - 1);
    var minTau = Math.max(2, Math.floor(sr / 1400));
    var d = new Float32Array(maxTau + 2), c = new Float32Array(maxTau + 2);
    var tau, j, s, diff;
    for (tau = 1; tau <= maxTau; tau++) {
      s = 0;
      for (j = 0; j < W; j++) { diff = data[j] - data[j + tau]; s += diff * diff; }
      d[tau] = s;
    }
    var run = 0; c[0] = 1;
    for (tau = 1; tau <= maxTau; tau++) {
      run += d[tau];
      c[tau] = run === 0 ? 1 : d[tau] * tau / run;
    }
    var est = -1;
    for (tau = minTau; tau < maxTau; tau++) {
      if (c[tau] < 0.2) {
        while (tau + 1 < maxTau && c[tau + 1] < c[tau]) tau++;
        est = tau; break;
      }
    }
    if (est < 0) {
      var mv = 1;
      for (tau = minTau; tau < maxTau; tau++) if (c[tau] < mv) mv = c[tau];
      if (mv >= 0.32) return 0;
      for (tau = minTau + 1; tau < maxTau; tau++) {
        if (c[tau] <= mv + 0.05 && c[tau] < c[tau - 1] && c[tau] <= c[tau + 1]) { est = tau; break; }
      }
      if (est < 0) return 0;
    }
    var better = est;
    if (est > 1 && est < maxTau) {
      var s0 = c[est - 1], s1 = c[est], s2 = c[est + 1];
      var den = 2 * (2 * s1 - s0 - s2);
      if (den !== 0) better = est + (s2 - s0) / den;
    }
    return sr / better;
  }

  // ---------- Pembacaan ----------
  var history = [], lastGood = 0, lastDet = 0, shown = 0, targetCents = 0, active = false;
  var lastKey = -1, lastCents = 0, levelTarget = 0, levelShown = 0;
  var meter = $("meter");

  function idleStatus() {
    if (!state.running) return "TEKAN MULAI";
    return isChrom() ? "MAINKAN SATU NADA" : "PETIK SATU SENAR";
  }

  function resetReading() {
    history = []; active = false; hitIndex = -1; hitChip = -1; isOk = false; targetCents = 0; lastKey = -1;
    meter.classList.add("idle");
    meter.classList.remove("ok", "warn");
    var t = cur();
    $("noteTxt").innerHTML = (!t.chrom && state.mode === "manual") ? noteHTML(targets()[state.sel], t.flats) : "--";
    $("centsTxt").textContent = "--";
    $("statusTxt").textContent = idleStatus();
    $("hzTxt").textContent = (!t.chrom && state.mode === "manual") ? "target " + midiFreq(targets()[state.sel]).toFixed(1) + " Hz" : "";
    markStrings();
  }

  function pickTarget(f) {
    if (state.mode === "manual") return state.sel;
    var best = 0, bestAbs = Infinity;
    targets().forEach(function (m, i) {
      var a = Math.abs(centsBetween(f, midiFreq(m)));
      if (a < bestAbs) { bestAbs = a; best = i; }
    });
    return best;
  }

  function show(f) {
    var t = cur(), m, key, tf, cents;
    if (t.chrom) {
      var mf = 69 + 12 * Math.log(f / state.a4) / Math.LN2;
      m = Math.round(mf); key = m;
      tf = midiFreq(m);
      cents = (mf - m) * 100;
      hitChip = ((m % 12) + 12) % 12; hitIndex = -1;
    } else {
      var idx = pickTarget(f);
      m = targets()[idx]; key = idx;
      tf = midiFreq(m);
      cents = centsBetween(f, tf);
      hitIndex = idx; hitChip = -1;
    }
    if (active && key === lastKey) cents = lastCents * 0.5 + cents * 0.5;
    lastKey = key; lastCents = cents;
    active = true;
    targetCents = clamp(cents, -50, 50);
    var r = Math.round(cents);
    isOk = Math.abs(cents) <= OK_CENTS;
    meter.classList.remove("idle");
    meter.classList.toggle("ok", isOk);
    meter.classList.toggle("warn", !isOk);
    $("noteTxt").innerHTML = noteHTML(m, t.flats);
    $("centsTxt").innerHTML = (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r) + '<tspan class="unit"> cent</tspan>';
    $("statusTxt").textContent = isOk ? "PAS" : (cents < 0 ? "KURANG" : "LEBIH");
    $("hzTxt").textContent = f.toFixed(1) + " Hz  ·  target " + tf.toFixed(1) + " Hz";
    markStrings();
  }

  function detect(now) {
    if (!analyser) return;
    analyser.getFloatTimeDomainData(buf);
    var sum = 0, i;
    for (i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    var rms = Math.sqrt(sum / buf.length);
    levelTarget = levelOf(rms);
    var f = 0;
    if (rms > GATE) {
      f = yin(buf, ctx.sampleRate);
      if (f < 45 || f > 1400) f = 0;
    }
    if (f) {
      history.push(f);
      if (history.length > 6) history.shift();
      var med = median(history);
      var close = history.filter(function (x) { return Math.abs(centsBetween(x, med)) < 40; });
      if (close.length >= 3) {
        lastGood = now;
        show(median(close));
      }
    } else if (active && now - lastGood > 900) {
      resetReading();
    }
  }

  var fillEl = $("levelFill");
  function loop(t) {
    requestAnimationFrame(loop);
    if (state.running && t - lastDet > 50) { lastDet = t; detect(t); }
    shown += (targetCents - shown) * 0.2;
    setNeedle(shown);
    levelShown += (levelTarget - levelShown) * 0.35;
    fillEl.style.width = (levelShown * 100).toFixed(1) + "%";
  }

  // ---------- Event ----------
  $("startBtn").addEventListener("click", function () { state.running ? stop() : start(); });
  $("modeAuto").addEventListener("click", function () { setMode("auto"); });
  $("modeManual").addEventListener("click", function () { setMode("manual"); });
  $("tuningSel").addEventListener("change", function (e) {
    state.tuning = e.target.value;
    state.sel = 0;
    persist();
    buildStrings();
    resetReading();
  });
  $("a4Minus").addEventListener("click", function () { state.a4 = Math.max(430, state.a4 - 1); updateA4(); persist(); });
  $("a4Plus").addEventListener("click", function () { state.a4 = Math.min(450, state.a4 + 1); updateA4(); persist(); });

  // ---------- Pasang sebagai aplikasi (PWA) ----------
  var deferredInstall = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstall = e;
    $("installRow").hidden = false;
  });
  $("installBtn").addEventListener("click", function () {
    if (!deferredInstall) return;
    var p = deferredInstall; deferredInstall = null;
    $("installRow").hidden = true;
    p.prompt();
    if (p.userChoice) p.userChoice.catch(function () {});
  });
  window.addEventListener("appinstalled", function () { $("installRow").hidden = true; deferredInstall = null; });
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }

  // ---------- Init ----------
  buildTuningSelect();
  buildStrings();
  updateA4();
  resetReading();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
