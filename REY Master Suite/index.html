<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0b0d;--pn:#141417;--ln:#2a2a30;--gd:#d9a93f;--gl:#f0c05a;--tx:#ebe8e0;--dm:#a7a398}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.app{height:100dvh;display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
header,footer{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 16px;border-color:var(--ln);border-style:solid;border-width:0}
header{border-bottom-width:1px;flex-wrap:wrap}
footer{border-top-width:1px;justify-content:space-between;flex-wrap:wrap}
.logo{width:48px;height:48px;border-radius:50%}
h1{margin:0;font-size:18px;letter-spacing:.1em;color:var(--gd)}
.sub{color:var(--dm);font-size:10px;letter-spacing:.18em}
.tr{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap;justify-content:flex-end}
.tr input[type=range]{flex:1;min-width:120px;max-width:320px}
button,.btn{font:inherit;color:var(--tx);background:#1e1e23;border:1px solid var(--ln);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--gd)}
button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible,.btn:focus-within{outline:2px solid var(--gd);outline-offset:2px}
.pri{background:var(--gd);color:#17120a;border-color:var(--gd);font-weight:600}
input[type=range]{accent-color:var(--gd);width:100%}input[type=file]{display:none}
nav{padding:12px 10px;overflow:auto;border-right:1px solid var(--ln);background:#0e0e11}
.sl{font-size:10px;letter-spacing:.2em;color:var(--gd);margin:12px 8px 6px}
.si{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;padding:8px 10px;border-radius:6px}
.si.sel{background:#2a2110;border-color:var(--gd);color:var(--gl)}
.si.soon{opacity:.5}
.sn{color:var(--dm);font-size:11px;min-width:18px}
.dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#3a3a40}
.dot.on{background:var(--gd);box-shadow:0 0 6px var(--gd)}
main{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;min-height:0}
.mh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.mh small{font-size:10px;letter-spacing:.2em;color:var(--gd)}
.mh h2{margin:2px 0 0;font-size:20px;letter-spacing:.06em}
.pwr,.pw{padding:5px 16px;font-weight:600}
.pw{padding:2px 10px;font-size:11px}
.pwr.on,.pw.on{background:#3a2e12;border-color:var(--gd);color:var(--gl)}
.mb{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
canvas.vz{width:100%;flex:1;min-height:220px;background:#0f0f12;border:1px solid var(--ln);border-radius:8px}
.kp{display:flex;justify-content:center;flex-wrap:wrap;gap:28px;padding:14px 18px;background:linear-gradient(#17171b,#111114);border:1px solid var(--ln);border-radius:8px}
.hint{color:var(--dm);font-size:12px;margin:6px 0 0}
.knobs{display:flex;flex-wrap:wrap;gap:22px}
.kn{width:92px;text-align:center}.kn canvas{cursor:ns-resize;touch-action:none}
.kl{font-size:11px;letter-spacing:.08em;color:var(--dm);text-transform:uppercase;margin-top:2px}.kv{color:var(--gl);font-weight:600}
.viz{display:flex;gap:14px;align-items:flex-start}.viz canvas{border:1px solid var(--ln);border-radius:6px}
.grc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dm)}
.grb{width:20px;height:240px;background:#101013;border:1px solid var(--ln);border-radius:4px;position:relative;overflow:hidden}
.grb i{position:absolute;top:0;left:0;right:0;background:var(--gd)}
.eqh{flex-direction:column;gap:0;align-items:stretch}
.eqw{position:relative;flex:1;min-height:260px}
.eqc{position:absolute;inset:0;width:100%;height:100%;background:#0f0f12;border:1px solid var(--ln);border-radius:8px 8px 0 0;touch-action:none;cursor:crosshair}
.pk{display:block;width:100%;height:26px;border:1px solid var(--ln);border-top:0;border-radius:0 0 8px 8px}
.tb{position:absolute;display:flex;gap:6px;align-items:center;background:rgba(20,20,24,.96);border:1px solid var(--gd);border-radius:8px;padding:5px 8px;font-size:11px;z-index:2;color:var(--dm)}
.tb input,.tb select{font:inherit;background:#101013;color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:3px 4px}
.tb input{width:62px}
.tb label{display:flex;align-items:center;gap:3px}
.bn{width:20px;height:20px;border-radius:50%;color:#111;font-weight:700;display:grid;place-items:center}
.nt{color:var(--gl);font-weight:600;min-width:26px}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:8px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px}
.tile a{flex:1;cursor:pointer}.tile a:hover{color:var(--gl)}.tile.soon{opacity:.5}
.no{width:20px;height:20px;border-radius:50%;border:1px solid var(--gd);color:var(--gd);font-size:11px;display:grid;place-items:center}
.big{width:100%;max-width:520px}
label{display:flex;justify-content:space-between;font-size:11px;color:var(--dm)}
output{color:var(--gl);font-weight:600}
.bar{height:8px;background:#101013;border:1px solid var(--ln);border-radius:4px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--gd)}.bar i.clip{background:#e5533d}
small{font-size:10px;letter-spacing:.16em;color:var(--dm);display:block}
footer b{font-weight:600}#es.live{color:var(--gl)}
.mid{text-align:center}#st{font-size:12px;color:var(--dm);max-width:420px}
.mo{min-width:220px}
canvas.vz{min-height:200px}
.lts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lt{background:linear-gradient(#17171b,#111114);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}
.lt b{display:block;font-size:30px;color:var(--gl);font-weight:600;line-height:1.2}
.lt span{color:var(--dm);font-size:11px}
.mbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mbc{background:linear-gradient(#17171b,#111114);border:1px solid var(--ln);border-top:3px solid var(--c);border-radius:8px;padding:8px}
.mbt{text-align:center;font-size:10px;letter-spacing:.16em;color:var(--c);margin-bottom:6px}
.mbk{display:flex;justify-content:center;flex-wrap:wrap;gap:4px}
.moff .mb{opacity:.55}
.moff .mh h2::after{content:'  OFF: putar knob atau klik ON';font-size:11px;font-weight:400;color:var(--dm);letter-spacing:.04em}
.eqbar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--dm);letter-spacing:.12em;flex-wrap:wrap}
.eqbar .sp{flex:1}.eqbar button{padding:3px 10px;font-size:11px}.eqbar button.on{background:#3a2e12;border-color:var(--gd);color:var(--gl)}
.chips{display:flex;gap:4px}.chip{padding:3px 9px!important;border-width:2px!important}.chip.on{background:#3a2e12!important}
.mb.row{flex-direction:row}
.kp.col{flex-direction:column;flex-wrap:nowrap;justify-content:space-around;gap:16px;padding:14px 12px}
.dec{flex-direction:row;align-items:stretch;gap:14px}
.dcol,.dmid,.dr{background:linear-gradient(#17171b,#111114);border:1px solid var(--ln);border-radius:8px;padding:14px}
.dcol{display:flex;flex-direction:column;justify-content:space-around;align-items:center;gap:10px}
.dmid{flex:1.3;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:12px}
.dr{flex:1;min-width:240px;display:flex;flex-direction:column;gap:12px}
.drow{display:flex;justify-content:center;gap:24px}
.styles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.styles button.on,.punish.on{background:#3a2e12;border-color:var(--gd);color:var(--gl)}
.punish{padding:8px 28px;font-weight:700;letter-spacing:.14em}
@media(max-width:820px){.lts{grid-template-columns:1fr 1fr}.mbs{grid-template-columns:1fr 1fr}.mb.row,.dec{flex-direction:column}.kp.col{flex-direction:row;flex-wrap:wrap}.app{height:auto;min-height:100dvh;grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}nav{display:flex;gap:6px;align-items:center;border-right:0;border-bottom:1px solid var(--ln);padding:8px}.sl{display:none}.si{width:auto;white-space:nowrap}.eqw{min-height:300px}}
.rey-home{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1b160d;border:1.5px solid #8a6a1e;color:#f4d67e;text-decoration:none}
.rey-home[hidden]{display:none}
.rey-home svg{width:18px;height:18px;display:block}
.rey-home:hover{border-color:#f4d67e}
.rey-home:focus-visible{outline:3px solid #f4d67e;outline-offset:2px}
</style>

<script>

const $ = (s, e = document) => e.querySelector(s);
const dB = x => Math.pow(10, x / 20), clamp = (v, a, z) => Math.max(a, Math.min(z, v));
const G = (c, v = 1) => { const g = c.createGain(); g.gain.value = v; return g; };
const P = (k, l, a, b, d, u) => ({k, l, a, b, d, u});

/* ---- Urutan modul = urutan rantai audio (g: 0 Core, 1 Character, 2 Additional) ---- */
const MODS = [
 {id:'gate', n:'Noise / Gate', g:2, p:[P('thr','Threshold',-80,0,-50,' dB'),P('range','Range',-80,0,-40,' dB'),P('atk','Attack',.2,50,2,' ms'),P('rel','Release',20,250,120,' ms'),P('reduce','Reduction',0,30,12,' dB'),P('sens','Sensitivity',0,24,6,' dB')]},
 {id:'eq', n:'EQ', g:0, eq:1},
 {id:'deess', n:'De-Esser', g:1, p:[P('amount','Amount',0,100,50,'%'),P('freq','Frequency',3000,12000,6500,' Hz'),P('rel','Release',20,300,80,' ms')]},
 {id:'comp', n:'Compressor', g:0, p:[P('thr','Threshold',-60,0,-18,' dB'),P('ratio','Ratio',1,20,3,':1'),P('atk','Attack',0,100,10,' ms'),P('rel','Release',20,1000,200,' ms'),P('knee','Knee',0,40,6,' dB'),P('mk','Makeup',0,18,0,' dB')]},
 {id:'mb', n:'Multiband', g:2, p:[0,1,2,3].flatMap(k => [P('t'+k,'Thresh',-60,0,-24,' dB'),P('r'+k,'Ratio',1,10,2,':1'),P('g'+k,'Gain',-12,12,0,' dB')])},
 {id:'sat', n:'Saturation', g:1, p:[P('drive','Drive',0,24,8,' dB'),P('locut','Low Cut',20,500,20,' Hz'),P('hicut','High Cut',2000,20000,20000,' Hz'),P('tone','Tone',-12,12,0,' dB'),P('out','Output',-12,12,0,' dB'),P('mix','Mix',0,100,100,'%')]},
 {id:'air', n:'Air & Presence', g:1, p:[P('pres','Mid Air',0,9,2,' dB'),P('air','High Air',0,12,3,' dB'),P('trim','Trim',-12,12,0,' dB')]},
 {id:'chorus', n:'Chorus', g:2, p:[P('rate','Rate',.1,5,.8,' Hz'),P('depth','Depth',0,8,3,' ms'),P('fb','Feedback',0,80,0,'%'),P('mix','Mix',0,100,40,'%')]},
 {id:'imager', n:'Stereo Imager', g:1, p:[P('width','Width',0,200,100,'%'),P('bass','Mono Bass',20,400,20,' Hz')]},
 {id:'delay', n:'Delay', g:2, p:[P('time','Delay',10,1500,350,' ms'),P('fb','Feedback',0,95,35,'%'),P('tone','Tone',500,16000,6000,' Hz'),P('wob','Wobble',0,100,0,'%'),P('mix','Mix',0,100,25,'%')]},
 {id:'reverb', n:'Reverb', g:2, p:[P('pre','PreDelay',0,200,20,' ms'),P('decay','Decay',.3,8,2.5,' s'),P('damp','Damping',1500,20000,12000,' Hz'),P('lowcut','Low Cut',20,600,60,' Hz'),P('mix','Mix',0,100,25,'%')]},
 {id:'lim', n:'Limiter', g:0, p:[P('ceil','Ceiling',-12,0,-1,' dB'),P('drive','Gain',0,12,0,' dB'),P('rel','Release',10,500,100,' ms')]},
 {id:'meter', n:'Loudness', g:0, meter:1}
];
MODS.forEach(m => { m.v = {}; (m.p || []).forEach(p => m.v[p.k] = p.d); m.on = m.id === 'eq'; });
const SATM = MODS.find(m => m.id === 'sat'); SATM.v.style = 0; SATM.v.punish = 0; ['chorus', 'delay', 'reverb'].forEach(id => MODS.find(m => m.id === id).v.mode = 0);
MODS.find(m => m.id === 'deess').v.listen = 0; const MBM = MODS.find(m => m.id === 'mb'); MBM.v.x1 = 120; MBM.v.x2 = 800; MBM.v.x3 = 5000; const GM = MODS.find(m => m.id === 'gate'); GM.v.mode = 0; for (let k = 0; k < 8; k++) GM.v['nth' + k] = -70;
const EQ = [[50,'lowshelf'],[120],[300],[800],[2000],[5000],[10000],[16000,'highshelf']].map(a => ({f:a[0], g:0, q:1, on:true, t:a[1] || 'peaking'}));
const COL = ['#e8b84b','#4fd3e8','#c06be8','#5fd38a','#f07a5a','#6b8ef0','#f06b9a','#c4e04b'];

/* ---- Mesin efek (node bawaan browser) ---- */
const mixer = (c, pin, pout) => { const i = G(c), o = G(c), d = G(c), w = G(c); i.connect(d); d.connect(o); i.connect(pin); pout.connect(w); w.connect(o);
  return {i, o, mix(x) { w.gain.value = x / 100; d.gain.value = 1 - x / 100; }}; };
const RVP = [{p: 3, a: .08}, {p: 2.5, a: .005}, {p: 3.5, a: .01}, {p: 3, a: .03}];
const ir = (c, s, md) => { const R = RVP[md], sec = md === 2 ? Math.min(s, 1.2) : s, n = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, n, c.sampleRate);
  for (let h = 0; h < 2; h++) { const d = b.getChannelData(h); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, R.p) * Math.min(1, i / n / R.a);
    if (md === 2) for (let k = 0; k < 14; k++) d[Math.floor(c.sampleRate * (.004 + k * .0045 + Math.random() * .003))] += (Math.random() - .5) * 1.2 * (1 - k / 14); } return b; };
const CURVES = [x => Math.tanh(2 * x) / Math.tanh(2), x => Math.tanh(1.6 * x + .35 * x * x) / Math.tanh(1.95), x => 1.5 * x - .5 * x * x * x, x => Math.atan(3 * x) / Math.atan(3), x => { const a = Math.abs(x) * 1.4; return Math.sign(x) * (a < .7 ? a : .7 + (1 - Math.exp(-(a - .7) * 8)) * .3); }];

  const hit = p => { let k = -1, bd = 16; EQ.forEach((b, i) => { const d = Math.hypot(fx(b.f) - p.x, gy(ng(b)) - p.y); if (d < bd) { bd = d; k = i; } }); return k; };
  cv.onpointerdown = e => { const i = hit(pt(e)); if (i >= 0) { drag = sel = i; cv.setPointerCapture(e.pointerId); } };
  cv.onpointermove = e => { const p = pt(e); hv = p; if (drag >= 0) { const o = {f: clamp(xf(p.x), FMIN, FMAX)}; if (ug(EQ[drag])) o.g = Math.round(clamp(yg(p.y), -DR, DR) * 10) / 10; engine.band(drag, o); } };
  cv.onpointerup = () => drag = -1; cv.onpointerleave = () => hv = null;
  cv.ondblclick = e => { const i = hit(pt(e)); if (i >= 0) { sel = i; engine.band(i, {g: 0, q: 1}); } };
  cv.addEventListener('wheel', e => { const i = hit(pt(e)); if (i < 0) return; e.preventDefault(); sel = i; engine.band(i, {q: clamp(EQ[i].q * (e.deltaY < 0 ? 1.1 : 1 / 1.1), .1, 10)}); }, {passive: false});
  ty.onchange = () => engine.band(sel, {t: ty.value});
  tf.onchange = () => engine.band(sel, {f: clamp(+tf.value || EQ[sel].f, FMIN, FMAX)});
  tg.onchange = () => engine.band(sel, {g: clamp(+tg.value || 0, -DR, DR)});
  tq.onchange = () => engine.band(sel, {q: clamp(+tq.value || 1, .1, 10)});
  bo.onclick = () => engine.band(sel, {on: !EQ[sel].on});
  return {off() { ro.disconnect(); }, draw() {
    chip.forEach((x, i) => { x.classList.toggle('on', i === sel); x.style.opacity = EQ[i].on ? 1 : .4; });
    c.clearRect(0, 0, W, H); c.font = '10px system-ui,sans-serif'; c.textBaseline = 'middle'; c.lineWidth = 1;
    [20,50,100,200,500,1000,2000,5000,10000,20000].forEach(f => { const x = fx(f); c.strokeStyle = '#212127'; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke();
      c.fillStyle = '#a7a398'; c.textAlign = x < 14 ? 'left' : x > W - 14 ? 'right' : 'center'; c.fillText(f >= 1000 ? f / 1000 + 'k' : f, x, H - 8); });
    (DR === 6 ? [-6,-3,0,3,6] : DR === 12 ? [-12,-6,0,6,12] : [-18,-12,-6,0,6,12,18]).forEach(g => { const y = gy(g); c.strokeStyle = g ? '#212127' : '#4a4a52'; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); c.fillStyle = '#a7a398'; c.textAlign = 'left'; c.fillText((g > 0 ? '+' : '') + g, 4, y - 7); });
    if (playing && anOn) { sp = sp || new Float32Array(engine.bins); const ny = engine.spectrum(sp), len = sp.length; c.beginPath(); c.moveTo(0, H);
      for (let x = 0; x <= W; x += 2) c.lineTo(x, H - clamp((sp[Math.min(len - 1, Math.round(xf(x) / ny * len))] + 90) / 80, 0, 1) * (H - 24));
      c.lineTo(W, H); c.closePath(); const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(120,160,200,.32)'); g.addColorStop(1, 'rgba(120,160,200,.05)'); c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(150,185,220,.5)'; c.stroke(); }
    else if (!playing) { c.fillStyle = '#6f6c64'; c.textAlign = 'center'; c.fillText(buf ? 'Tekan Play untuk melihat analyzer' : 'Muat audio untuk melihat analyzer', W / 2, H * .82); }
    if (M.eq.on) EQ.forEach((b, i) => { if (!b.on || (ug(b) && Math.abs(b.g) < .05)) return; engine.bandResponse(i, fr, mg, ph); c.beginPath(); c.moveTo(fx(fr[0]), gy(0));
      mg.forEach((m, k) => c.lineTo(fx(fr[k]), gy(clamp(20 * Math.log10(m), -DR, DR)))); c.lineTo(W, gy(0)); c.closePath(); c.fillStyle = COL[i] + (i === sel ? '3a' : '1f'); c.fill(); });
    engine.response(fr, mg, ph, t); c.beginPath(); t.forEach((m, i) => { const y = gy(clamp(20 * Math.log10(m), -DR, DR)); i ? c.lineTo(fx(fr[i]), y) : c.moveTo(fx(fr[i]), y); });
    c.save(); c.shadowColor = 'rgba(240,192,90,.55)'; c.shadowBlur = 9; c.strokeStyle = M.eq.on ? '#f0c05a' : '#6f6c64'; c.lineWidth = 2.5; c.stroke(); c.restore();
    c.lineTo(W, gy(0)); c.lineTo(0, gy(0)); c.closePath(); c.fillStyle = 'rgba(240,192,90,.09)'; c.fill();
    EQ.forEach((b, i) => { const x = fx(b.f), y = gy(ng(b)); c.globalAlpha = b.on ? 1 : .35; c.save(); c.shadowColor = COL[i]; c.shadowBlur = i === sel ? 14 : 6; c.beginPath(); c.arc(x, y, i === sel ? 9 : 7, 0, 7); c.fillStyle = COL[i]; c.fill(); c.restore();
      c.fillStyle = '#111'; c.textAlign = 'center'; c.font = 'bold 10px system-ui'; c.fillText(i + 1, x, y + .5); c.globalAlpha = 1; });
    if (hv && drag < 0 && hit(hv) < 0) { const f = clamp(xf(hv.x), FMIN, FMAX), s = fmtF(f) + '  ' + noteOf(f) + '  ' + yg(hv.y).toFixed(1) + ' dB', w = c.measureText(s).width + 10, tx = clamp(hv.x + 10, 0, W - w), ty2 = clamp(hv.y - 22, 0, H - 18);
      c.font = '10px system-ui'; c.fillStyle = 'rgba(20,20,24,.92)'; c.fillRect(tx, ty2, w, 16); c.fillStyle = '#ebe8e0'; c.textAlign = 'left'; c.fillText(s, tx + 5, ty2 + 8); }
    const b = EQ[sel]; bn.textContent = sel + 1; bn.style.background = COL[sel]; bo.textContent = b.on ? 'ON' : 'OFF'; bo.classList.toggle('on', b.on); nt.textContent = noteOf(b.f); tg.disabled = !ug(b);
    if (!tb.contains(document.activeElement)) { ty.value = b.t; tf.value = Math.round(b.f * 10) / 10; tg.value = b.g.toFixed(1); tq.value = b.q.toFixed(2); }
    const y = gy(ng(b)), bw = tb.offsetWidth, bh = tb.offsetHeight; tb.style.left = clamp(fx(b.f) - bw / 2, 4, Math.max(4, W - bw - 4)) + 'px'; tb.style.top = (y > H / 2 ? Math.max(4, y - bh - 16) : Math.min(H - bh - 4, y + 16)) + 'px'; }};
}

/* ---- Loop ---- */
let pkH = 0; const lvl = x => x > 1e-5 ? 20 * Math.log10(x) : -Infinity;
function frame() {
  lkUpdate();
  if (buf) { const p = pos(); if (!dragSeek) $('#seek').value = p / buf.duration * 1000; $('#time').textContent = fmtT(dragSeek ? $('#seek').value / 1000 * buf.duration : p) + ' / ' + fmtT(buf.duration); }
  $('#fn').textContent = buf ? base : 'Belum ada audio'; $('#es').textContent = playing ? 'PLAYING' : 'STANDBY'; $('#es').classList.toggle('live', playing);
  if (view) view.draw();
  const l = engine.levels(); pkH = Math.max(l.pk, pkH * .95); const p = lvl(pkH), r = lvl(l.rms), w = x => clamp((x + 60) / 60, 0, 1) * 100 + '%';
  document.querySelectorAll('.pkt').forEach(e => e.textContent = isFinite(p) ? p.toFixed(1) + ' dB' : '-inf'); document.querySelectorAll('.rmt').forEach(e => e.textContent = isFinite(r) ? r.toFixed(1) + ' dB' : '-inf');
  document.querySelectorAll('.pkb').forEach(e => { e.style.width = w(p); e.classList.toggle('clip', p > -.1); }); document.querySelectorAll('.rmb').forEach(e => e.style.width = w(r));
  requestAnimationFrame(frame); }
show('eq'); frame();
